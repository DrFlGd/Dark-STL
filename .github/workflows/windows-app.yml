name: Windows app

# Builds the Windows app with PyInstaller (packaging/windows/darkstl.spec), so it runs
# without Python, smoke-tests it (packaging/windows/smoke.py), and wraps it two ways:
# DarkSTL_<version>_x64-setup.exe (Inno Setup, per-user, no administrator rights) and
# DarkSTL_<version>_x64-portable.zip. The installer is smoke-tested too, once installed.
# Both go up as the windows-app artifact. Runs on pull requests that touch the app, and
# from the Release workflow, which attaches both files to the release.
on:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "tests/synth.py"
      - "pyproject.toml"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "commit to build"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[gui]" pywebview==6.2.1 pyinstaller==6.22.3
      - name: Version
        id: version
        run: |
          v=$(python -c "import darkstl; print(darkstl.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$v"
      - name: Build the app (PyInstaller)
        run: pyinstaller packaging/windows/darkstl.spec --noconfirm --distpath build/windows/dist --workpath build/windows/work
      - name: Smoke-test the app
        env:
          PYTHONUTF8: "1"
        run: timeout 900 python packaging/windows/smoke.py "build/windows/dist/Dark STL"
      - name: Build the installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco upgrade innosetup -y --no-progress | Select-Object -Last 3
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "/DAppVersion=$env:VERSION" packaging\windows\darkstl.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Portable zip
        run: |
          cd build/windows/dist
          7z a -tzip -bd "../../../dist/DarkSTL_${{ steps.version.outputs.version }}_x64-portable.zip" "Dark STL" > /dev/null
          cd ../../..
          ls -la dist
      - name: Install with the installer, then smoke-test the installed app
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHONUTF8: "1"
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Dark STL"
          $setup = Start-Process -Wait -PassThru -FilePath "dist\DarkSTL_${env:VERSION}_x64-setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($setup.ExitCode) { throw "setup exited with $($setup.ExitCode)" }
          python packaging/windows/smoke.py $dir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
