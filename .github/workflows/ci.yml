name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[gui,remesh,dev]"
      - name: Browser for the page tests
        if: runner.os == 'Linux'
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -q
