[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-stl"
version = "0.6.0"
description = "Browse FromSoftware game models, add texture detail by displacement, and export print-ready meshes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "pillow>=10.0",
    "texture2ddecoder>=1.0.4",
    "zstandard>=0.21",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
remesh = ["pyacvd>=0.3", "pyvista>=0.43"]
fast = ["pyamg>=5.0"]  # multigrid solver: integration on the mesh in about two thirds of the time
ai = ["onnxruntime>=1.17"]  # AI upscaling/deblocking models (onnxruntime-directml on Windows for the GPU)
dev = ["pytest>=7", "onnx>=1.15", "onnxruntime>=1.17"]
all = ["dark-stl[gui,remesh,fast,ai]"]

[project.scripts]
darkstl = "darkstl.cli:main"

[project.gui-scripts]
darkstl-gui = "darkstl.app.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darkstl = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
